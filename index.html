<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claw Machine</title>

  <link rel="stylesheet" href="src/styles/style.css">

  <script type="importmap">
        {
          "imports": {
            "three": "https://threejs.org/build/three.module.js",
            "three/addons/": "https://threejs.org/examples/jsm/"
          }
        }
    </script>
</head>

<body>
  <div id="main-menu">
    <div class="menu-content">
      <h1 class="glitch" data-text="NEON ARCADE">NEON ARCADE</h1>
      <p>A retro claw machine experience</p>
      <button id="start-button">INSERT COIN</button>
    </div>
  </div>

  <div id="loading-screen" class="hidden">
    <div class="loader-content">
      <div class="spinner"></div>
      <h1>LOADING ARCADE</h1>
      <p>Initializing neon lights and arcade machines...</p>
    </div>
  </div>

  <div id="ui">
    <p class="desktop-only"><b>⬅ ⬆ ⬇ ➡ </b> Mover <br> <b>ESPAÇO:</b> Apanhar</p>
    <p class="mobile-only"><b>Joystick</b> Mover <br> <b>GO:</b> Apanhar</p>
  </div>

  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-stick"></div>
    </div>
    <div id="action-button">GO</div>
  </div>

  <script type="module" src="./src/js/main.js"></script>
</body>

</html>
