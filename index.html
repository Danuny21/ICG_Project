<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claw Machine 3D</title>

  <link rel="stylesheet" href="src/styles/style.css">

  <script type="importmap">
        {
          "imports": {
            "three": "https://threejs.org/build/three.module.js",
            "three/addons/": "https://threejs.org/examples/jsm/"
          }
        }
    </script>
</head>

<body>
  <div id="main-menu">
    <div class="menu-content">
      <h1 class="glitch" data-text="CLAW MACHINE 3D">CLAW MACHINE 3D</h1>
      <p>Uma experiência retro de máquina de garras</p>
      <button id="start-button">INSERIR MOEDA</button>
    </div>
  </div>

  <div id="loading-screen" class="hidden">
    <div class="loader-content">
      <div class="spinner"></div>
      <h1>LOADING ...</h1>
    </div>
  </div>

  <div id="ui">
    <p class="desktop-only"><b>⬅ ⬆ ⬇ ➡ </b> Mover <br> <b>ESPAÇO:</b> Apanhar</p>
    <p class="mobile-only"><b>Joystick</b> Mover <br> <b>GO:</b> Apanhar</p>
  </div>
  <div id="ui-collection" class="desktop-only hidden">
    <p><b>CLIQUE</b> num prémio para o ver de perto</p>
  </div>
  <div id="camera-views" class="camera-views">
    <button id="btn-view-machine" class="cam-btn active">MÁQUINA</button>
    <button id="btn-view-collection" class="cam-btn">COLEÇÃO</button>
    <button id="btn-view-table" class="cam-btn">MESA</button>
  </div>
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-stick"></div>
    </div>
    <div id="action-button">GO</div>
  </div>

  <!-- UI de Abertura de Cápsulas -->
  <div id="capsule-hint" class="capsule-hint"></div>
  <div id="capsule-prize-name" class="capsule-prize-name"></div>

  <!-- UI do Inspetor de Prémios -->
  <div id="prize-inspector-ui" class="inspector-ui-container">
    <h1 id="inspector-title" class="inspector-title"></h1>
    <p id="inspector-hint" class="inspector-hint"><b>Clique <br> Espaço <br> para continuar</b></p>
  </div>

  <script type="module" src="./src/js/main.js"></script>
</body>

</html>
